version: '3.8'

services:
  # PostgreSQL Database for User Management
  postgres:
    image: postgres:15-alpine
    container_name: product-ledger-db
    environment:
      POSTGRES_USER: productledger
      POSTGRES_PASSWORD: productledger123
      POSTGRES_DB: product_ledger_users
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productledger"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: product-ledger-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://productledger:productledger123@postgres:5432/product_ledger_users
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:8080
      FABRIC_USE_MOCK: ${FABRIC_USE_MOCK:-true}
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server/logs:/app/logs
    restart: unless-stopped

  # Frontend (Development)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: product-ledger-frontend
    environment:
      VITE_API_URL: http://localhost:3001/api
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

